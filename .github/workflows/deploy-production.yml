name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Go tests run alongside the release build; deploy waits for both.
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go vet ./... && go test ./...
        working-directory: services/api

  # Compiles on the runner (warm Go and pnpm caches), then packages the three images
  # in parallel with buildx bake. Runs on other refs (manual dispatch) stop after compiling and testing.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test and compile
        run: |
          set -e
          (cd services/api && for cmd in api worker content-backfill migrate; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "../../.ci-out/api/$cmd" "./cmd/$cmd"
          done) &
          go_build=$!
          pnpm test
          pnpm --filter @snap/web --filter @snap/admin build
          wait "$go_build"
          cp -R apps/web/dist .ci-out/web
          cp -R apps/admin/public/source-logos .ci-out/web/source-logos
          cp -R apps/admin/dist .ci-out/admin
      - if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        uses: docker/bake-action@v6
        env:
          TAG: ${{ github.sha }}
        with:
          source: .
          files: infra/production/docker-bake.hcl
          push: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test-go, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/production
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%r@%%h\n  ControlPersist 120\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      # Deployment only: upload the compose file and script, then pull and start the release.
      # Server configuration (nginx, TLS, .env) is managed by hand over SSH, never here.
      - name: Deploy release
        run: |
          scp infra/production/compose.yaml infra/production/deploy.sh prod:/opt/lanka-news-paper/
          printf '%s\n' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh prod "chmod 700 /opt/lanka-news-paper/deploy.sh && /opt/lanka-news-paper/deploy.sh '${{ github.sha }}'"
      - name: Remove registry credentials
        if: always()
        run: ssh prod 'docker logout ghcr.io >/dev/null 2>&1 || true'
