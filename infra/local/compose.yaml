name: snap-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: snap
      POSTGRES_DB: snap
    volumes:
      - snap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snap -d snap"]
      interval: 2s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/local/worker.Dockerfile
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
    working_dir: /workspace/services/api
    command: ["go", "run", "./cmd/worker"]
    environment:
      SNAP_DATABASE_URL: postgres://snap:snap@postgres:5432/snap?sslmode=disable
      SNAP_ENV: local
      CODEX_HOME: /data/codex
      SNAP_CODEX_CONCURRENCY: ${SNAP_CODEX_CONCURRENCY:-2}
      SNAP_CODEX_QUOTA_COOLDOWN: ${SNAP_CODEX_QUOTA_COOLDOWN:-15m}
      SNAP_CODEX_MODELS: ${SNAP_CODEX_MODELS:-gpt-6-luna,gpt-6.1-sol,gpt-6-sol,gpt-5.6-luna,gpt-5.6-terra}
    volumes:
      - ../..:/workspace
      - snap-go-mod:/go/pkg/mod
      - snap-go-build:/root/.cache/go-build
      - ${HOME}/.codex:/data/codex
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  snap-pg:
  snap-go-mod:
  snap-go-build:
