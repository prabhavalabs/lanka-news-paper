name: snap-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: snap
      POSTGRES_DB: snap
    volumes:
      - snap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snap -d snap"]
      interval: 2s
      timeout: 5s
      retries: 20

  worker:
    image: golang:1.25-alpine
    restart: unless-stopped
    working_dir: /workspace/services/api
    command: ["go", "run", "./cmd/worker"]
    environment:
      SNAP_DATABASE_URL: postgres://snap:snap@postgres:5432/snap?sslmode=disable
      SNAP_ENV: local
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../..:/workspace
      - snap-go-mod:/go/pkg/mod
      - snap-go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  snap-pg:
  snap-go-mod:
  snap-go-build:
