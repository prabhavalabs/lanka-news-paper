name: snap-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: snap
      POSTGRES_DB: snap
    volumes:
      - snap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snap -d snap"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  snap-pg:
