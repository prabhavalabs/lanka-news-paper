# Thulawa News: thulawanews.com (reader site), admin.thulawanews.com, api.thulawanews.com.
# Installed by hand on the VPS as /etc/nginx/sites-available/thulawanews; CI/CD never touches it.
# Certificate (Let's Encrypt, webroot): see docs/deployment.md "DNS and TLS".

server {
    listen 80;
    listen [::]:80;
    server_name thulawanews.com www.thulawanews.com admin.thulawanews.com api.thulawanews.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lanka-news-paper-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# www is an alias; the canonical reader address is the bare domain.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.thulawanews.com;

    ssl_certificate /etc/letsencrypt/live/thulawanews.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thulawanews.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://thulawanews.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thulawanews.com;

    ssl_certificate /etc/letsencrypt/live/thulawanews.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thulawanews.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18173;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.thulawanews.com;

    ssl_certificate /etc/letsencrypt/live/thulawanews.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thulawanews.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location = /api/admin/jobs/stream {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        proxy_pass http://127.0.0.1:18174;
    }

    location = /api/admin/social/facebook/callback {
        # The query contains a single-use OAuth code and state.
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 22m;
        proxy_pass http://127.0.0.1:18174;
    }

    location ~ ^/api/admin/(watch-tower/threads/[^/]+/messages|newsletter/tests|social/posts|social/posts/[^/]+/review)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 22m;
        proxy_pass http://127.0.0.1:18174;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18174;
    }
}

# Public read API only. Administration stays on admin.thulawanews.com, where the
# session cookie lives, so /api/admin is not exposed on this host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.thulawanews.com;

    ssl_certificate /etc/letsencrypt/live/thulawanews.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thulawanews.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location ^~ /api/admin/ {
        return 404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18090;
    }
}
