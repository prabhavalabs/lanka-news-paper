name: lanka-news-paper

x-app-environment: &app-environment
  SNAP_DATABASE_URL: ${SNAP_DATABASE_URL:?set SNAP_DATABASE_URL}
  SNAP_ENV: production
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SNAP_ADMIN_ANALYSIS_WORKERS: ${SNAP_ADMIN_ANALYSIS_WORKERS:-16}
  CODEX_HOME: /data/codex
  SNAP_CODEX_CONCURRENCY: ${SNAP_CODEX_CONCURRENCY:-2}
  SNAP_CODEX_QUOTA_COOLDOWN: ${SNAP_CODEX_QUOTA_COOLDOWN:-15m}
  SNAP_CODEX_MODELS: ${SNAP_CODEX_MODELS:-gpt-6-luna,gpt-6.1-sol,gpt-6-sol,gpt-5.6-luna,gpt-5.6-terra}
  SNAP_MEDIA_LOCAL_DIR: /data/media
  SNAP_NEWSLETTER_BASE_URL: ${SNAP_NEWSLETTER_BASE_URL:-https://lankanewspaper.prabhavalabs.com}
  SNAP_NEWSLETTER_ENABLED: ${SNAP_NEWSLETTER_ENABLED:-false}
  SNAP_NEWSLETTER_FROM: ${SNAP_NEWSLETTER_FROM:-}
  SNAP_NEWSLETTER_RECIPIENT: ${SNAP_NEWSLETTER_RECIPIENT:-}
  SNAP_NEWSLETTER_SEND_HOUR: ${SNAP_NEWSLETTER_SEND_HOUR:-8}
  SNAP_NEWSLETTER_TIMEZONE: ${SNAP_NEWSLETTER_TIMEZONE:-Asia/Colombo}
  SNAP_META_APP_ID: ${SNAP_META_APP_ID:-}
  SNAP_META_APP_SECRET: ${SNAP_META_APP_SECRET:-}
  SNAP_META_REDIRECT_URL: ${SNAP_META_REDIRECT_URL:-https://admin.lankanewspaper.prabhavalabs.com/api/admin/social/facebook/callback}
  SNAP_META_LOGIN_CONFIG_ID: ${SNAP_META_LOGIN_CONFIG_ID:-}
  SNAP_META_GRAPH_VERSION: ${SNAP_META_GRAPH_VERSION:-v26.0}
  SNAP_SOCIAL_TOKEN_KEY: ${SNAP_SOCIAL_TOKEN_KEY:-}
  SNAP_SOCIAL_PUBLIC_BASE_URL: ${SNAP_SOCIAL_PUBLIC_BASE_URL:-}
  SNAP_SOCIAL_CHROME_PATH: ${SNAP_SOCIAL_CHROME_PATH:-/usr/bin/chromium}
  SNAP_SOCIAL_CHROME_NO_SANDBOX: ${SNAP_SOCIAL_CHROME_NO_SANDBOX:-true}
  SNAP_MIGRATIONS_PATH: /app/migrations
  SNAP_R2_ACCESS_KEY_ID: ${SNAP_R2_ACCESS_KEY_ID:-}
  SNAP_R2_ACCOUNT_ID: ${SNAP_R2_ACCOUNT_ID:-}
  SNAP_R2_BUCKET: ${SNAP_R2_BUCKET:-}
  SNAP_R2_SECRET_ACCESS_KEY: ${SNAP_R2_SECRET_ACCESS_KEY:-}
  SNAP_SESSION_SECRET: ${SNAP_SESSION_SECRET:?set SNAP_SESSION_SECRET}

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lanka_news
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: lanka_news
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanka_news -d lanka_news"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 1

  migrate:
    image: ghcr.io/prabhavalabs/lanka-news-paper-api:${IMAGE_TAG:?set IMAGE_TAG}
    entrypoint: ["/app/migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]
    mem_limit: 256m
    cpus: 0.5

  api:
    image: ghcr.io/prabhavalabs/lanka-news-paper-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-environment
      SNAP_ALLOWED_ORIGINS: ${SNAP_ALLOWED_ORIGINS:?set SNAP_ALLOWED_ORIGINS}
      SNAP_API_ADDRESS: 0.0.0.0:8090
      SNAP_BOOTSTRAP_ADMIN_EMAIL: ${SNAP_BOOTSTRAP_ADMIN_EMAIL:?set SNAP_BOOTSTRAP_ADMIN_EMAIL}
      SNAP_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${SNAP_BOOTSTRAP_ADMIN_PASSWORD_HASH:?set SNAP_BOOTSTRAP_ADMIN_PASSWORD_HASH}
      SNAP_SESSION_COOKIE_SECURE: "true"
    volumes:
      - media-data:/data/media
      - codex-data:/data/codex
    ports:
      - "127.0.0.1:18090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    cpus: 0.75

  worker:
    image: ghcr.io/prabhavalabs/lanka-news-paper-api:${IMAGE_TAG:?set IMAGE_TAG}
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - codex-data:/data/codex
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g
    cpus: 4

  codex-login:
    image: ghcr.io/prabhavalabs/lanka-news-paper-api:${IMAGE_TAG:?set IMAGE_TAG}
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R app:app /data/codex && exec su-exec app codex login --device-auth"]
    environment:
      CODEX_HOME: /data/codex
    volumes:
      - codex-data:/data/codex
    profiles: [tools]
    stdin_open: true
    tty: true

  web:
    image: ghcr.io/prabhavalabs/lanka-news-paper-web:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 64m
    cpus: 0.15

  admin:
    image: ghcr.io/prabhavalabs/lanka-news-paper-admin:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18174:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 64m
    cpus: 0.15

volumes:
  codex-data:
  media-data:
  postgres-data:
