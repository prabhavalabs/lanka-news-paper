server {
    listen 80;
    listen [::]:80;
    server_name lankanewspaper.prabhavalabs.com admin.lankanewspaper.prabhavalabs.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lanka-news-paper-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lankanewspaper.prabhavalabs.com;

    ssl_certificate /etc/letsencrypt/live/lankanewspaper.prabhavalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lankanewspaper.prabhavalabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18173;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.lankanewspaper.prabhavalabs.com;

    ssl_certificate /etc/letsencrypt/live/lankanewspaper.prabhavalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lankanewspaper.prabhavalabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location = /api/admin/jobs/stream {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
        proxy_pass http://127.0.0.1:18174;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:18174;
    }
}
